name: Test

on:
  pull_request:
    branches: [master, cli]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      # 4 tests currently fail on this branch for pre-existing, unrelated reasons.
      - run: uv run python -m unittest discover -p "test_*.py" -v
