name: Lint

on:
  pull_request:
    branches: [master, cli]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen --group dev
      - run: uv run ruff check src/
