services:
  manga-downloader:
    image: ghcr.io/axsddlr/weebcentral-dl:ui
    # For local builds, replace the line above with:
    # build:
    #   context: .
    container_name: weebcentral-dl-ui
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./config.toml:/app/config.toml
      # manga_downloads is BOTH the download destination AND the library source.
      # Downloaded manga appear in the Library reader automatically — no extra setup.
      - ./manga_downloads:/app/manga_downloads
      - ./weebcentral.db:/app/weebcentral.db
      # OPTIONAL: mount external manga collections you already have (not downloaded by this tool).
      # Add "/app/library" to library_paths in config.toml or Settings UI to include them.
      - ./library:/app/library:ro
    environment:
      - CONFIG_FILE=config.toml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/stats')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  manga-watcher:
    image: weebcentral-dl:latest
    container_name: weebcentral-dl-watcher
    profiles:
      - watcher
    depends_on:
      manga-downloader:
        condition: service_healthy
    command: ["python", "-m", "src.watcher"]
    env_file:
      - .env
    volumes:
      - ./manga_list.txt:/app/manga_list.txt
      - ./config.toml:/app/config.toml
      - ./manga_downloads:/app/manga_downloads
      - ./weebcentral.db:/app/weebcentral.db
    environment:
      - MANGA_LIST=manga_list.txt
      - CONFIG_FILE=config.toml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
