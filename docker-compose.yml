services:
  manga-downloader:
    image: ghcr.io/axsddlr/weebcentral-dl:cli
    # For local builds, replace the line above with:
    # build:
    #   context: .
    container_name: weebcentral-dl
    # One-off CLI run:
    #   docker compose run --rm manga-downloader python main.py "Manga Title" -l
    command: ["python", "-m", "src.watcher"]
    volumes:
      - ./config.toml:/app/config.toml
      - ./manga_list.txt:/app/manga_list.txt
      - ./manga_downloads:/app/manga_downloads
      - ./weebcentral.db:/app/weebcentral.db
    environment:
      - CONFIG_FILE=config.toml
      - MANGA_LIST=manga_list.txt
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
