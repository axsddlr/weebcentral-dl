services:
  manga-downloader:
    build:
      context: .
    image: weebcentral-dl:latest
    container_name: weebcentral-dl-ui
    ports:
      - "8000:8000"
    volumes:
      # Mount config file so UI config edits persist on host
      - ./config.toml:/app/config.toml

      # Persist downloads to host
      - ./manga_downloads:/app/manga_downloads
    environment:
      # Config path used by API and queue services
      - CONFIG_FILE=config.toml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/stats')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  manga-watcher:
    image: weebcentral-dl:latest
    container_name: weebcentral-dl-watcher
    profiles:
      - watcher
    command: ["python", "-m", "src.watcher"]
    volumes:
      # Mount manga list file for automated watcher mode
      - ./manga_list.txt:/app/manga_list.txt

      # Mount config file for watcher hot reload
      - ./config.toml:/app/config.toml

      # Persist downloads to host
      - ./manga_downloads:/app/manga_downloads
    environment:
      - MANGA_LIST=manga_list.txt
      - CONFIG_FILE=config.toml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
