services:
  manga-downloader:
    build:
      context: .
    image: weebcentral-dl:latest
    container_name: weebcentral-dl-ui
    ports:
      - "8000:8000"
    volumes:
      - ./config.toml:/app/config.toml
      - ./manga_downloads:/app/manga_downloads
      - ./weebcentral.db:/app/weebcentral.db
      # Library mount: symlink or copy manga folders into ./library on the host.
      # They appear at /app/library in the container for the Library reader.
      # Add "/app/library" to library_paths in config.toml or Settings UI.
      - ./library:/app/library:ro
    environment:
      - CONFIG_FILE=config.toml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/stats')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  manga-watcher:
    image: weebcentral-dl:latest
    container_name: weebcentral-dl-watcher
    profiles:
      - watcher
    depends_on:
      manga-downloader:
        condition: service_healthy
    command: ["python", "-m", "src.watcher"]
    volumes:
      - ./manga_list.txt:/app/manga_list.txt
      - ./config.toml:/app/config.toml
      - ./manga_downloads:/app/manga_downloads
      - ./weebcentral.db:/app/weebcentral.db
    environment:
      - MANGA_LIST=manga_list.txt
      - CONFIG_FILE=config.toml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
